<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio & Experiments — Joan Dídac Barbé Espinoza</title>

  <!-- p5.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <!-- Fuentes de Google Fonts: Inter y Oswald (requeridas por sketch.js) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@700&display=swap" rel="stylesheet">

  <!-- Estilos base para evitar scrollbars no deseados -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background-color: #AD9E89; /* COLOR_SANDLIGHT */
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Opcional: Cargar estilos desde un archivo CSS externo si lo usas */
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Contenedor donde p5.js incrustará el canvas -->
  <div id="canvas-container"></div>

  <!-- Archivo de lógica de la aplicación -->
  <script src="sketch.js"></script>
</body>
</html>
